# configuration for linters and project
[project]
name = "rideshare_data_pipeline"
dependencies = [
    "modin",
    "pandas==1.5.0",
    "pyarrow==8.0.0",
    "pandas-stubs",
    "numpy==1.24.4",
    "pytest",
    "pyproject-toml",
    "mypy",
    "black",
    "ruff",
]
version = "0.1"

[tool.mypy]
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
addopts = [
    "--import-mode=importlib",
]