[project]
name = "rideshare_data_pipeline"
version = "0.1"
description = "Quality-control and outlier checks for a consumer e-receipt panel sample covering two rideshare merchants."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "EvonneC" }]
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "polars>=2.0.0",
]

[project.scripts]
rideshare-qc = "rideshare_data_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# Files that go into the sdist only (the wheel holds the package): the tests and tools
# let a downstream build run the suite, qc.example.toml is the documented config and
# uv.lock pins the dev environment.
[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "qc.example.toml", "uv.lock"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.15"
strict = true
# `mypy .` checks both trees; src/ is the import root for the package.
mypy_path = "src"
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
addopts = ["--import-mode=importlib", "-ra"]
strict = true
markers = [
    "slow: runs on the real data; skipped unless RIDESHARE_QC_DATA names a local file",
]
