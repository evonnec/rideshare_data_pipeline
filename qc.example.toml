# Example config for `rideshare-qc run --config qc.example.toml`.
# Every value below is the default; delete what you don't change. Unknown keys and
# check names are errors (exit status 2), so a typo can't silently do nothing.

sample_limit = 20     # failing rows kept per check (samples/<check>.parquet)
fail_on = "error"     # "error" or "warn": the lowest severity whose failure exits 1
                      # (the --fail-on flag overrides this)

# Per check: max_failed_rate (the check passes while failed / evaluated is at most
# this), severity ("error", "warn" or "info") and enabled (false removes the check).

[checks.cast_failures]       # S2: columns with values that don't convert to their type
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.non_negative_total]  # A1: order_total_amount >= 0 (rider-spend receipts only)
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.checksum_unique]     # U1: checksum is unique
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.category_mismatch]   # V2: category 'Travel' on a food order, freight, rental or driver earnings
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.all_null_columns]    # S4: columns that are null in every row (info, no threshold)
severity = "info"
enabled = true

[checks.constant_columns]    # S5: columns with one distinct non-null value (info)
severity = "info"
enabled = true

[checks.duplicate_rows]      # U0: exact duplicate rows
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.receipt_kinds]       # K1: receipt kind composition (info, no threshold)
severity = "info"
enabled = true

[checks.unclassified_subject_templates]  # K2: rows no kind rule matched (info, no threshold)
severity = "info"
enabled = true

[checks.duplicate_receipts]  # U2: (merchant_name, order_number) repeats; warn, the dedupe resolves it
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.dedupe_key_unique]   # U2b: the key is unique among receipts the dedupe kept
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.cross_panelist_duplicates]  # U3: one order key under more than one user_id
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.near_duplicate_rides]  # U4: rides alike but for the order number (flag only)
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.description_parse_coverage]  # PC1: unparsed rate of ride descriptions, worst merchant (max 2%)
max_failed_rate = 0.02
severity = "warn"
enabled = true
