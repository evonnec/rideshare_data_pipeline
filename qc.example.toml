# Example config for `rideshare-qc run --config qc.example.toml`.
# Every value below is the default; delete what you don't change. Unknown keys and
# check names are errors (exit status 2), so a typo can't silently do nothing.

sample_limit = 20     # failing rows kept per check (samples/<check>.parquet)
fail_on = "error"     # "error" or "warn": the lowest severity whose failure exits 1
                      # (the --fail-on flag overrides this)
min_rows = 1          # row_count_band: fewest rows expected (0 = no lower bound); a
                      # header-only file fails with the default of 1
# max_rows = 5000000  # row_count_band: most rows expected (default: no upper bound)

# At least one check must stay enabled (a config that turns every check off is an error).
# Per check: max_failed_rate (the check passes while failed / evaluated is at most
# this), severity ("error", "warn" or "info") and enabled (false removes the check).

[checks.header_valid]        # S1: the 33 expected columns, in order (a bad header exits 2 before this)
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.utf8_valid]          # S3: valid UTF-8; BOM and line endings recorded (bad bytes exit 2)
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.cast_failures]       # S2: a record that the strict parse passed: a value that doesn't convert (or is
max_failed_rate = 0.0        # nan, inf or out of range) exits 2 before any check runs. Can't be disabled.
severity = "error"
enabled = true               # must stay true (false is a config error)

[checks.row_count_band]      # the row count is within min_rows..max_rows (metric: the count itself)
severity = "warn"
enabled = true

[checks.required_fields]     # C1: merchant_name, user_id, email_time, checksum, from_domain, email_subject
max_failed_rate = 0.0        # are never null
severity = "error"
enabled = true

[checks.id_formats]          # S6: user_id 64 hex, checksum 32 hex, Lyft order 18-19 digits, Uber order UUID
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.non_negative_total]  # A1: order_total_amount >= 0 (rider-spend receipts only)
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.item_price_equals_subtotal]  # A2: |item_price - order_subtotal| <= 0.01 where both are present
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.zero_fare_rides]     # A3: ride and tip-update receipts (not superseded) with a total of exactly 0
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.discount_within_subtotal]  # A4: order_discount <= order_subtotal + 0.01 where both are present
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.tax_within_total]    # A5: order_tax <= order_total_amount + 0.01 where both are present
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.unexplained_residual]  # A6: total - (subtotal + tax - discount) above max(20, subtotal), USD rider-spend rides
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.checksum_unique]     # U1: checksum is unique
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.category_mismatch]   # V2: category 'Travel' on a food order, freight, rental or driver earnings
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.merchant_sender_consistent]  # V1: Uber receipts from Uber sender domains, Lyft from Lyft
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.unknown_sender]      # V3: the sender matches no known receipt-sender pattern
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.ingestion_order]     # T1: insert_time <= update_time <= source_dttimestamp <= dttimestamp (where present)
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.order_before_receipt]  # T2: order date <= email date + 1 day (order_time local, email_time UTC)
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.late_receipts]       # T3: email date more than 7 days after the order date (30-day count in the report)
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.order_before_window] # T4: order more than 7 days before the earliest email date
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.email_after_update]  # T5: email_time after update_time
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.all_null_columns]    # S4: columns that are null in every row (info, no threshold)
severity = "info"
enabled = true

[checks.constant_columns]    # S5: columns with one distinct non-null value (info)
severity = "info"
enabled = true

[checks.duplicate_rows]      # U0: exact duplicate rows
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.ride_completeness]   # C2: rides' null rates: total <= 0.01%, order_number <= 0.5%, order_time <= 0.5%
severity = "warn"            # (per-field limits are fixed; max_failed_rate would replace the worst field's)
enabled = true

[checks.identity_share]      # A7: share of rides where total = subtotal + tax - discount (info, no threshold)
severity = "info"
enabled = true

[checks.receipt_kinds]       # K1: receipt kind composition (info, no threshold)
severity = "info"
enabled = true

[checks.unclassified_subject_templates]  # K2: rows no kind rule matched (info, no threshold)
severity = "info"
enabled = true

[checks.duplicate_receipts]  # U2: (merchant_name, order_number) repeats; warn, the dedupe resolves it
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.dedupe_key_unique]   # U2b: the key is unique among receipts the dedupe kept
max_failed_rate = 0.0
severity = "error"
enabled = true

[checks.cross_panelist_duplicates]  # U3: one order key under more than one user_id
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.near_duplicate_rides]  # U4: rides alike but for the order number (flag only)
max_failed_rate = 0.0
severity = "warn"
enabled = true

[checks.description_parse_coverage]  # PC1: unparsed rate of ride descriptions, worst merchant (max 2%)
max_failed_rate = 0.02
severity = "warn"
enabled = true

[checks.currency_suspect_rows]  # CUR1: non-US sender, km distance or Spanish/Portuguese subject
max_failed_rate = 0.0           # (a warning: the gate is money.usd_rides, not this verdict)
severity = "warn"
enabled = true

[checks.date_only_order_time]  # T6: per merchant, the share of order_time at exactly midnight (info, no threshold)
severity = "info"
enabled = true
